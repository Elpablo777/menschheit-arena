[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "menschheit-arena"
version = "0.1.0"
description = "Zweisprachige Multi-Agenten-Debatten-Arena und sicheres KI-Pentest-Control-Plane"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Menschheit Arena" }]
keywords = ["ai-safety", "multi-agent", "debate", "llm", "security", "fastapi"]
dependencies = [
  "fastapi>=0.115",
  "uvicorn>=0.30",
  "pydantic>=2.7",
  "httpx>=0.27",
  "jinja2>=3.1",
  "sqlalchemy>=2.0",
  "python-dotenv>=1.0",
]

[project.optional-dependencies]
postgres = ["psycopg[binary]>=3.2"]
dev = ["pytest>=8", "ruff>=0.8"]

[project.scripts]
menschheit = "menschheit.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
menschheit = [
  "i18n/*.json",
  "prompts/*/*.md",
  "knowledge/*.md",
  "web/templates/*.html",
  "web/static/*",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
filterwarnings = ["ignore::DeprecationWarning"]

[tool.ruff]
line-length = 110
target-version = "py311"

[tool.ruff.lint]
# Bewusst grosszuegig: breite Exception-Handler an API- und CLI-Grenzen,
# lange String-Konkatenationen in Mock-Texten und Reports.
select = ["E", "F", "I"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["E501"]
