name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Doctor
        run: python -m menschheit.cli doctor

      - name: Tests
        run: pytest -q

      - name: Ruff
        run: ruff check src tests

  demo:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -e .
      - name: Demo-Debatte ohne API-Key
        run: python -m menschheit.cli demo --rounds 1
      - name: Demo-Bericht vorhanden
        run: test -n "$(ls reports/*.md 2>/dev/null)"